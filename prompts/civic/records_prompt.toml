# YATSEE civic records extraction prompts.
# Each meeting type routes to one chunk-level extraction prompt. Parsed chunk
# records are consolidated deterministically by code; no LLM reduction or final
# synthesis stage is used.

[records_router]
city_council = "city_council_records"
finance_committee = "finance_committee_records"
committee_of_the_whole = "committee_of_the_whole_records"
zoning_committee = "zoning_committee_records"
general = "general_records"

[prompts.city_council_records]
text = """
You are extracting structured civic records from one segment of a city council transcript.

Context: {context}

Transcript Segment:
{text}

Extract only facts explicitly supported by this segment. Missing data is correct. Invented data is incorrect.

Prioritize:
- explicit attendance and absence from roll call
- agenda and minutes approvals
- ordinances and resolutions
- contracts, spending, claims, bids, and consent-agenda amounts
- motions, makers, seconders, vote methods, outcomes, and explicit roll calls
- proclamations, recognitions, appointments, and presentations as distinct from formal action
- public comments as distinct from council action
- explicit follow-ups and quantitative facts

Rules:
- Emit one record per event or fact. Do not combine motion, vote, discussion, and public comment into one record.
- Do not infer attendance from names mentioned or people who speak.
- Do not infer a motion, seconder, individual vote, unanimity, or outcome.
- If a roll call is interrupted or no result is announced, use outcome "unknown" and omit unsupported votes.
- Do not treat a proclamation, recognition, presentation, recommendation, or public request as council action.
- Preserve exact numbers and qualifiers such as approximately, up to, more than, or approaching.
- Use an exact or near-exact contiguous transcript excerpt as evidence.
- Omit absent optional attributes. Do not use placeholders such as N/A, none, or unknown except for an explicitly uncertain outcome.
- Output compact JSONL only. Write one complete JSON object per line. Do not use Markdown fences, array brackets, commas between lines, or commentary.

Allowed record_type values:
attendance, procedural_action, presentation, discussion, motion, vote, public_comment, financial, metric, ordinance, resolution, contract, project, appointment, proclamation, recognition, follow_up, other

Each record object must match this shape:
{{
  "record_type": "",
  "subject": "",
  "summary": "",
  "evidence": "",
  "attribution": "<person, role, department, or governing body if explicit>"
}}

- Do not infer attribution.
- Omit attribution when it is not explicitly supported.

The optional attributes object may contain other explicitly supported structured details.
Omit attributes when no other structured details are supported.

Return one compact JSON object per line.
Do not wrap records in an array.
Do not add commas between lines.
If no supported records exist, return exactly [].
"""

